<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vine</title>
    <link rel="stylesheet" href="style.css">
    <!-- Preload fonts or use system fonts for performance and "native" feel -->
</head>

<body>

    <!-- Main Header -->
    <header id="main-header" class="app-header">
        <div class="header-left">
            <button class="icon-btn" id="header-menu-btn">
                <!-- Hamburger Icon -->
                <svg viewBox="0 0 24 24" fill="#fff" width="24" height="24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
            </button>
        </div>
        <div class="header-center">
            <h1 class="logo">Vine</h1>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="header-cam-btn">
                <!-- Camera Icon (Decoration) -->
                <svg viewBox="0 0 24 24" fill="#fff" width="24" height="24">
                    <path
                        d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Side Menu Overlay -->
    <div id="side-menu-overlay" class="menu-overlay hidden"></div>
    <div id="side-menu" class="side-menu closed">
        <div class="menu-content">
            <p>2026 is the new 2016 | This web app brings back the nostalgia of the Vine app | RIP Vine </p>
            <p>Why Vine was cool: 6-second creativity, perfect looping, raw humor, zero pressure, and unforgettable
                internet moments.</p>
            <p>Made by gg</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <main id="app-container">
        <!-- Views will be injected here -->
        <div id="feed-view" class="view active">
            <!-- Feed items go here -->
        </div>

        <div id="profile-view" class="view hidden">
            <!-- Profile content goes here -->
        </div>

        <div id="explore-view" class="view hidden">
            <div class="placeholder-message">
                <h2>Explore</h2>
                <p>Trending & Popular Vines (Static Demo)</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="feed-view" id="nav-home">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
        </button>
        <button class="nav-item" data-target="explore-view" id="nav-explore">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path
                    d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
            </svg>
        </button>
        <button class="nav-item" data-target="profile-view" id="nav-profile">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
        </button>
    </nav>

    <script src="app.js"></script>
</body>

</html>
